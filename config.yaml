input:
  path: "./input"
  mode: "pdf"
  recursive: true

output:
  directory: "./output"

pdf:
  markdown_output_dir: "./markdown"

chunking:
  strip_headers: false

extraction:
  model_name: "llama3:latest"

parallel:
  enabled: true
  max_workers: 5

ollama:
  host: "http://localhost:11434"

logging:
  level: "INFO"
